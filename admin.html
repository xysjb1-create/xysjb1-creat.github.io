<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写新文章 - 博客后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #f0f6fc;
        }
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }
        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            tab-size: 2;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            background: #238636;
            color: #fff;
        }
        .btn:hover {
            background: #2ea043;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        .status.success {
            display: block;
            background: #0f2d1a;
            color: #58f098;
            border: 1px solid #238636;
        }
        .status.error {
            display: block;
            background: #2d0f0f;
            color: #f09858;
            border: 1px solid #da3633;
        }
        .status.loading {
            display: block;
            background: #1c2333;
            color: #8b949e;
            border: 1px solid #30363d;
        }
        .token-hint {
            background: #0d1117;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            color: #8b949e;
            border: 1px solid #30363d;
            margin-top: 10px;
            line-height: 1.8;
        }
        .token-hint code {
            background: #21262d;
            padding: 2px 8px;
            border-radius: 4px;
            color: #f0f6fc;
            font-size: 12px;
        }
        .token-hint a {
            color: #58a6ff;
        }
        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✍️ 写新文章</h1>
        <div class="subtitle">直接在博客里发布 — 自动提交到 GitHub</div>

        <!-- 文章标题 -->
        <div class="form-group">
            <label for="title">文章标题</label>
            <input type="text" id="title" placeholder="例如：ROP链构造入门笔记" />
        </div>

        <!-- 日期 + 分类 两列 -->
        <div class="row">
            <div class="form-group">
                <label for="date">日期</label>
                <input type="date" id="date" />
            </div>
            <div class="form-group">
                <label for="category">分类（可选）</label>
                <input type="text" id="category" placeholder="例如：漏洞分析" />
            </div>
        </div>

        <!-- 标签 -->
        <div class="form-group">
            <label for="tags">标签（逗号分隔，可选）</label>
            <input type="text" id="tags" placeholder="例如：Shellcode, 逆向, ROP" />
        </div>

        <!-- 正文 -->
        <div class="form-group">
            <label for="content">正文（支持 Markdown）</label>
            <textarea id="content" placeholder="用 Markdown 写文章内容..."></textarea>
        </div>

        <!-- 发布按钮 -->
        <button class="btn" id="publishBtn">🚀 发布文章</button>

        <!-- 状态提示 -->
        <div class="status" id="status"></div>

        <!-- GitHub Token 设置提示 -->
        <div class="token-hint">
            <strong>🔑 首次使用需设置 GitHub Token</strong><br />
            1. 访问 <a href=" " target="_blank">GitHub Settings → Tokens</a >，点击 <strong>Generate new token (classic)</strong><br />
            2. 勾选 <code>repo</code> 权限，生成后复制 Token<br />
            3. 在浏览器地址栏输入以下格式保存（替换 YOUR_TOKEN）：<br />
            <code>javascript:localStorage.setItem('github_token','YOUR_TOKEN');alert('Token 已保存！');</code><br />
            4. 按回车执行后，刷新本页面即可发布文章。
        </div>
    </div>

    <script>
        (function() {
            const titleInput = document.getElementById('title');
            const dateInput = document.getElementById('date');
            const categoryInput = document.getElementById('category');
            const tagsInput = document.getElementById('tags');
            const contentInput = document.getElementById('content');
            const publishBtn = document.getElementById('publishBtn');
            const statusDiv = document.getElementById('status');

            // 默认日期：今天
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            // 获取保存的 Token
            function getToken() {
                return localStorage.getItem('github_token');
            }

            // 显示状态
            function setStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
            }

            // 清除状态（用于加载中）
