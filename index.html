<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Log — 我的网络安全博客</title>
    <style>
        /* ============ CSS 变量 & 重置 ============ */
        :root {
            --bg: #f8f9fb;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --accent: #e63946;
            --accent-dark: #c1121f;
            --border: #e8e8f0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', 'Monaco', monospace;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent-dark);
        }

        /* ============ 顶部导航 ============ */
        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.92);
        }

        .site-header .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .site-title .terminal-prompt {
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 1.1rem;
        }

        .site-title a {
            color: inherit;
            text-decoration: none;
        }
        .site-title a:hover {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition);
        }
        .nav-links a:hover {
            color: var(--accent);
        }

        /* ============ 主容器 ============ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        /* ============ 首页文章列表 ============ */
        .blog-intro {
            text-align: center;
            padding: 3rem 0 2rem;
        }
        .blog-intro .tag {
            display: inline-block;
            background: rgba(230, 57, 70, 0.1);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            border: 1px solid rgba(230, 57, 70, 0.2);
        }
        .blog-intro h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }
        .blog-intro p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 520px;
            margin: 0 auto;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-top: 2rem;
        }

        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem 2rem;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .post-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: rgba(230, 57, 70, 0.3);
            transform: translateY(-2px);
        }
        .post-card:hover::before {
            opacity: 1;
        }

        .post-card .post-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
        }
        .post-card .post-meta .date-badge {
            background: rgba(0, 0, 0, 0.04);
            padding: 0.2rem 0.7rem;
            border-radius: 6px;
            font-size: 0.75rem;
        }
        .post-card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 0.35rem;
            transition: color var(--transition);
        }
        .post-card:hover h2 {
            color: var(--accent);
        }
        .post-card .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .post-card .read-more {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-6px);
            transition: all var(--transition);
        }
        .post-card:hover .read-more {
            opacity: 1;
            transform: translateX(0);
        }

        /* 特殊卡片：黑底红字 —— 对应第一篇博客 */

            background: #000000;
            border: 1
